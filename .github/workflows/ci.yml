name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Install the wireless extras
        if: matrix.python == '3.13'
        run: python -m pip install -e ".[wifi]"

      - name: Test
        run: |
          set -o pipefail
          python -m pytest -q --tb=line 2>&1 | tee pytest.log

      - name: Publish the output
        if: failure()
        run: |
          {
            echo "### pytest output"
            echo '```'
            cat pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
